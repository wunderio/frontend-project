---
# ArgoCD applications of the staging overlay: the main/master branch deploys to the
# staging environment.
# The platform chart in wunderio/argocd-cluster-management reads this file and renders
# one ArgoCD Application per entry in apps[]. See README.md, "ArgoCD deployment".

# Must equal the repository name in lowercase, or rendering fails.
namespace: PROJECT_NAME

apps:
  - name: frontend
    chart: frontend
    repoURL: oci://registry.wdr.io/charts
    version: ">=1.36.0"
    valuesFile: values/frontend.yaml

# Set to true once k8s/staging/secrets/ holds SOPS-encrypted Secrets (README.md).
secrets:
  enabled: false
