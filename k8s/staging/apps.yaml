---
# ArgoCD applications of the staging overlay: the main/master branch deploys to the
# staging environment.
# The ArgoCD platform reads this file and renders one ArgoCD Application per entry in
# apps[]. See README.md, "ArgoCD deployment".

# Must equal the repository name in lowercase, or rendering fails.
namespace: PROJECT_NAME

apps:
  - name: frontend
    # No repoURL: the chart comes from the platform's chart registry.
    chart: frontend
    version: ">=1.36.0"
    valuesFile: values/frontend.yaml

# Set to true once k8s/staging/secrets/ holds SOPS-encrypted Secrets (README.md).
secrets:
  enabled: false
