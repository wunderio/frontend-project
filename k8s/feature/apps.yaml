---
# ArgoCD applications of the feature overlay: feature/*, hotfix/* and epic/* pull
# requests deploy to pr-<N> environments.
# The platform chart in wunderio/argocd-cluster-management reads this file and renders
# one ArgoCD Application per entry in apps[]. See README.md, "ArgoCD deployment".

# Must equal the repository name in lowercase, or rendering fails.
namespace: PROJECT_NAME

apps:
  - name: frontend
    chart: frontend
    repoURL: https://storage.googleapis.com/charts.wdr.io
    version: ">=1.36.0"
    valuesFile: values/frontend.yaml

# Set to true once k8s/feature/secrets/ holds SOPS-encrypted Secrets (README.md).
secrets:
  enabled: false
