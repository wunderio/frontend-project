---
name: Build & Push Images

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "k8s/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'registry.wdr.io' }}
  REPO: ${{ github.event.repository.name }}

jobs:
  # ---------------------------------------------------------------
  # Stage 1: Validate codebase (lint, tests).
  # ---------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: ESLint
        run: npm run lint:es

      - name: Stylelint
        run: npm run lint:style

      - name: Test
        run: npm run test

  # ---------------------------------------------------------------
  # Stage 2: Build production assets.
  # ---------------------------------------------------------------
  build-assets:
    name: Install & Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload built codebase
        uses: actions/upload-artifact@v4
        with:
          name: built-codebase
          path: |
            .
            !.git
            !node_modules
          retention-days: 1

  # ---------------------------------------------------------------
  # Stage 3: Build and push Docker image.
  # ---------------------------------------------------------------
  build-image:
    name: Build & Push — node
    runs-on: ubuntu-latest
    needs: build-assets
    permissions:
      contents: read

    steps:
      - name: Build & push image
        uses: wunderio/silta-actions/build-push-image@v1
        with:
          artifact-name: built-codebase
          image-name: node
          dockerfile: silta/node.Dockerfile
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

  # ---------------------------------------------------------------
  # Stage 4: Update image tags in ArgoCD values files.
  # Queries the registry for the latest tags and commits the update.
  # ---------------------------------------------------------------
  update-tags:
    name: Update Image Tags
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
    steps:
      - name: Update image tags
        uses: wunderio/silta-actions/update-image-tags@v1
        with:
          image-names: "node=services.node.image"
          values-file: values/frontend.yaml
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
